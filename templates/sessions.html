<!DOCTYPE html>
{% extends 'base.html' %}

{% block title %}Sessions - Writer Copilot AI{% endblock %}

{% block content %}
<style>
  .modal-header,
  .modal-footer {
    background-color: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border-light);
  }

  [data-theme="dark"] .btn-close {
    filter: invert(1) brightness(200%);
  }

  .modal-body {
    background-color: var(--bg-card);
  }

  .modal-content {
    border: 1px solid var(--border-light);
  }

  .modal {
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }

  .session-card {
    border-radius: 16px;
    transition: all 0.2s ease;
  }

  .session-card:hover {

    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  }

  .btn-dark {
    background-color: var(--btn-primary);
    border-radius: 10px;
  }

  .card {
    border-radius: 16px;
  }

  .dropdown-menu {
    z-index: 1055;
    padding: 5px;
    font-size: 0.9rem;
    border: 1px solid var(--border-light);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.03);
    background-color: var(--bg-card);
    color: var(--text-primary);
  }

  .dropdown-item {
    color: var(--text-primary);
  }

  .dropdown-item:hover {
    background-color: var(--bg-card);
    color: var(--text-primary);
    border: var(--border-light) 1px solid;
  }

  #site-brand {
    display: none;
  }
</style>
<div class="container py-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-0">🖊 Writer’s Copilot</h2>
      <small class="text-secondary">Your creative workspace</small>
    </div>

    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
      + New Session
    </button>
  </div>

  <!-- Sessions Grid -->
  <div id="sessionsGrid" class="row g-4"></div>

  <!-- Empty State -->
  <div id="emptyState" class="text-center mt-5 d-none">
    <h5>No sessions yet</h5>
    <p class="text-secondary">Start your first story and let AI guide you.</p>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
      Create Session
    </button>
  </div>

</div>
<div class="modal fade" id="createModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{{ url_for('create_session') }}">
        <div class="modal-header">
          <h5 class="modal-title">New Session</h5>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal" title="Close">&times;</button>
        </div>

        <div class="modal-body">
          <div class="mb-2">
            <label>Title</label>
            <input type="text" name="session_name" class="form-control" placeholder="Enter session title" required>
          </div>

          <div class="mb-2">
            <label>Description</label>
            <textarea name="session_description" class="form-control"
              placeholder="Enter session description"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-primary w-100">Create</button>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{{ url_for('update_session') }}">
        <div class="modal-header">
          <h5 class="modal-title">Edit Session</h5>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal" title="Close">&times;</button>
        </div>

        <div class="modal-body">
          <input type="hidden" name="id" id="editId">
          <input type="hidden" name="timestamp" id="editTimestamp">

          <div class="mb-2">
            <label>Name</label>
            <input type="text" name="name" id="editName" class="form-control" placeholder="Enter session name" required>
          </div>

          <div class="mb-2">
            <label>Description</label>
            <textarea name="description" id="editDesc" class="form-control"
              placeholder="Enter session description"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-warning w-100">Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function updateSession() {
    const form = document.getElementById('editSessionForm');
    form.submit();
  }
  function getSessions() {
    const grid = document.getElementById('sessionsGrid');
    fetch('/get_sessions')
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          grid.innerHTML = '';
          const emptyState = document.getElementById('emptyState');
          const sessions = data.sessions;
          if (sessions.length === 0) {
            grid.innerHTML = '';
            emptyState.classList.remove('d-none');
            return;
          } else {
            emptyState.classList.add('d-none');
          }
          sessions.forEach(session => {
            const col = document.createElement('div');
            col.className = 'col-md-6 col-lg-4';

            col.innerHTML = `
              <div class="card h-100 shadow-sm border-0 session-card">
                
                <div class="card-body d-flex flex-column">
                  
                  <h5 class="fw-semibold mb-1">${session.session_name}</h5>
                  
                  <small class="text-secondary mb-2">
                    ${timeAgo(session.timestamp) || 'Just now'}
                  </small>

                  <p class="text-secondary flex-grow-1">
                    ${session.session_description?.slice(0, 80) || 'No description'}
                  </p>

                  <div class="d-flex justify-content-between align-items-center mt-3">

                    <a href="/session/${session.session_id}" class="btn btn-sm btn-dark">
                      Open →
                    </a>

                    <div class="dropdown">
                      <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="dropdown">
                        <span class="text-secondary">⋮</span>
                      </button>
                      <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                          <button class="dropdown-item edit-session"
                            data-id="${session.session_id}"
                            data-name="${session.session_name}"
                            data-desc="${session.session_description}"
                            data-timestamp="${session.timestamp}">
                            Edit
                          </button>
                        </li>
                        <li>
                          <button class="dropdown-item text-danger delete-session"
                            data-id="${session.session_id}"
                            data-timestamp="${session.timestamp}">
                            Delete
                          </button>
                        </li>
                      </ul>
                    </div>

                  </div>
                </div>
              </div>
            `;
            grid.appendChild(col);
          });
          initEditListeners();
          initDeleteListeners();
        }
      })
      .catch(err => console.error('Error loading sessions:', err));
  }

  function initEditListeners() {
    document.querySelectorAll('.edit-session').forEach(button => {
      button.onclick = function () {
        document.getElementById('editId').value = this.dataset.id;
        document.getElementById('editName').value = this.dataset.name;
        document.getElementById('editDesc').value = this.dataset.desc;
        document.getElementById('editTimestamp').value = this.dataset.timestamp;

        const modal = new bootstrap.Modal(document.getElementById('editModal'));
        modal.show();
      };
    });
  }
  function initDeleteListeners() {
    document.querySelectorAll('.delete-session').forEach(button => {
      button.onclick = async function () {
        showDialog({
          message: 'Are you sure you want to delete this session?',
          confirmText: 'Delete',
          cancelText: 'Cancel',
          showCancel: true,
          onConfirm: async () => {
            try {
              const res = await fetch('/delete_session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  id: this.dataset.id,
                  timestamp: this.dataset.timestamp
                })
              });

              if (res.ok) {
                getSessions();
                showToast({
                  type: 'success',
                  title: 'Success',
                  message: 'Session deleted successfully',
                  timer: 5000
                });
              } else {
                alert('Failed to delete');
                showToast({
                  type: 'error',
                  title: 'Error',
                  message: 'Failed to delete session',
                  timer: 5000
                });
              }
            } catch {
              alert('Error deleting session');
              showToast({
                type: 'error',
                title: 'Error',
                message: 'Failed to delete session',
                timer: 5000
              });
            }
          }
        });              
      };
    });
  }



  document.addEventListener('DOMContentLoaded', function () {
    getSessions();
  });
</script>
{% endblock %}
